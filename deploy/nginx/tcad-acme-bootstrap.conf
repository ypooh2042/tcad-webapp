# 인증서 발급 전용 임시 설정. **첫 배포 때 이것만 먼저 올린다.**
#
# 닭과 달걀 문제를 푼다: 본 설정(tcad.ypooh2062.link.conf)은 인증서 파일을
# 가리키는데, 인증서를 받으려면 도메인이 이미 서비스되고 있어야 한다. 인증서가
# 없는 상태로 본 설정을 올리면 nginx -t 가 실패하고, nginx 가 리로드되지 않으니
# certbot 도 검증을 통과하지 못한다.
#
# 순서:
#   1) 이 파일만 올린다
#        sudo cp deploy/nginx/tcad-acme-bootstrap.conf /etc/nginx/sites-available/
#        sudo ln -s /etc/nginx/sites-available/tcad-acme-bootstrap.conf \
#                   /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
#   2) 인증서만 받는다(설정은 건드리지 않는다)
#        sudo certbot certonly --webroot -w /var/www/html \
#             -d tcad.ypooh2062.link
#
#      `--nginx` 대신 `certonly --webroot` 를 쓰는 이유: --nginx 는 설정 파일을
#      직접 고쳐 자기 줄을 끼워 넣는다. 여기 적어 둔 설명과 구조가 흐트러진다.
#
#   3) 임시 설정을 걷어내고 본 설정으로 바꾼다
#        sudo rm /etc/nginx/sites-enabled/tcad-acme-bootstrap.conf
#        sudo cp deploy/nginx/tcad.ypooh2062.link.conf /etc/nginx/sites-available/
#        sudo ln -s /etc/nginx/sites-available/tcad.ypooh2062.link.conf \
#                   /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4) 갱신 후 nginx 리로드 훅을 설치한다 (**빠뜨리면 안 된다**)
#        sudo cp deploy/letsencrypt/reload-nginx.sh \
#                /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
#        sudo chmod 755 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
#        sudo certbot renew --dry-run
#
#      certonly 로 받은 인증서에는 installer 가 없어서 certbot 이 nginx 를
#      리로드하지 않는다. 갱신은 성공하는데 서비스는 옛 인증서를 계속 내보내고,
#      90일째에 아무 경고 없이 죽는다.
#
# 갱신 자체는 본 설정의 80 포트 블록이 같은 challenge 경로를 열어 두므로
# 그대로 동작한다. 자동 갱신은 certbot.timer 가 이미 돌리고 있으니 cron 을
# 따로 추가할 필요는 없다.

server {
    listen 80;
    listen [::]:80;
    server_name tcad.ypooh2062.link;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 아직 서비스 전이다. 나머지는 아무것도 내주지 않는다.
    location / {
        return 404;
    }
}
