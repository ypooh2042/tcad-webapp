# TCAD 웹앱 nginx 설정
#
# 설치:
#   sudo cp deploy/nginx/tcad.ypooh2062.link.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/tcad.ypooh2062.link.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 는 certbot 이 붙인다(아래 80 포트 블록만 두고 실행):
#   sudo certbot --nginx -d tcad.ypooh2062.link
#
# 전제: DNS A 레코드 tcad.ypooh2062.link → 이 서버의 공인 IP.

# 정적 파일과 API 응답의 크기·빈도 제한.
#
# 애플리케이션에도 빈도 제한이 있지만(app/api/throttle.py), 그건 요청이 파이썬
# 프로세스에 닿은 뒤에 동작한다. 폭주는 여기서 먼저 끊어야 uvicorn 이 그걸
# 받아내느라 시뮬레이션과 CPU 를 다투지 않는다.
limit_req_zone $binary_remote_addr zone=tcad_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tcad.ypooh2062.link;

    # certbot 이 이 블록을 https 리다이렉트로 바꾼다. 갱신용 challenge 경로는
    # 남겨 둬야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2 on;` 은 nginx 1.25.1 부터다. 이 서버는 1.24 이므로 listen 에 붙인다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tcad.ypooh2062.link;

    # certbot 이 채운다.
    ssl_certificate     /etc/letsencrypt/live/tcad.ypooh2062.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcad.ypooh2062.link/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── 보안 헤더 ────────────────────────────────────────────
    #
    # HSTS: 한 번 https 로 온 브라우저는 다음부터 http 를 시도조차 하지 않는다.
    # preload 는 넣지 않았다 — 목록에 올리면 되돌리기가 매우 어렵다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 응답 타입을 브라우저가 멋대로 추측하지 못하게 한다. 사용자가 올린
    # `.str` 내용이 HTML 로 해석되는 경로를 막는다.
    add_header X-Content-Type-Options "nosniff" always;
    # 이 앱을 iframe 에 넣지 못하게 한다(클릭재킹).
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 쓰지 않는 브라우저 기능을 끈다.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP.
    #
    # Monaco 는 워커를 blob: 으로 만들고 스타일을 인라인으로 넣는다. 그래서
    # worker-src blob: 과 style-src 'unsafe-inline' 이 필요하다.
    # **script-src 에는 'unsafe-inline'/'unsafe-eval' 을 주지 않는다** — 번들이
    # 전부 파일로 나가므로 필요 없고, 주면 XSS 방어가 사실상 사라진다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 소스 상한이 200,000자다. 여유를 두되 대용량 업로드 통로가 되지 않게 한다.
    client_max_body_size 2m;

    access_log /var/log/nginx/tcad.access.log;
    error_log  /var/log/nginx/tcad.error.log;

    # ── 프론트엔드 (정적 빌드 산출물) ────────────────────────
    root /srv/tcad/frontend;
    index index.html;

    location / {
        # SPA 라우팅은 없지만, 새로고침이 404 가 되지 않도록 index 로 보낸다.
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 파일은 내용이 바뀌면 이름도 바뀐다. 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 백엔드 API ───────────────────────────────────────────
    location /api/ {
        limit_req zone=tcad_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 시뮬레이션은 워커가 돌리고 API 는 상태만 돌려주므로 오래 걸리는 요청이
        # 없다. 그래도 컨테이너가 느릴 때를 대비해 조금 여유를 둔다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 카탈로그는 배포 중에 바뀌지 않는 공개 자료다(인증도 요구하지 않는다).
    # 브라우저가 캐시하게 두면 재방문 때 45개 커맨드 목록을 다시 받지 않는다.
    #
    # nginx 자체 캐시(proxy_cache)는 쓰지 않는다. proxy_cache_path 를 함께
    # 잡지 않으면 proxy_cache_valid 는 아무 일도 하지 않아서, 캐시가 도는
    # 줄 알고 넘어가기 쉽다. 앱도 이미 브라우저 안에서 캐시한다.
    location /api/catalog/ {
        limit_req zone=tcad_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=3600";
    }
}
